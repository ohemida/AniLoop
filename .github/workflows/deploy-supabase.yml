name: Deploy AniLoop Supabase function
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the trusted AniLoop API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add the repository secret SUPABASE_ACCESS_TOKEN first." >&2
            exit 1
          fi
          supabase functions deploy aniloop --project-ref adxwsbaztwgjzvynobad --yes
