# Run only from the sanitized release, after PUBLIC_LAUNCH.md is resolved.
# Loopback binding is deliberate; public binding requires an explicit host setting.
services:
  app:
    build: .
    image: aniloop:production-local
    environment:
      HOST: 0.0.0.0
      PORT: 8097
      ANILOOP_DB: /app/.runtime/community.sqlite3
      ANILOOP_PUBLIC_ORIGIN: https://${ANILOOP_SITE:?Set the exact HTTPS hostname, optionally with port}
      ANILOOP_SECURE_COOKIES: "1"
      ANILOOP_MANAGED_BACKUPS: "1"
      ANILOOP_ACCESS_LOG: "0"
    volumes:
      - accounts:/app/.runtime
      - cache:/app/.tools
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  proxy:
    image: caddy:2-alpine
    environment:
      ANILOOP_SITE: ${ANILOOP_SITE:?Set the exact HTTPS hostname, optionally with port}
    ports:
      - "${ANILOOP_BIND:-127.0.0.1}:${ANILOOP_HTTP_PORT:-80}:80"
      - "${ANILOOP_BIND:-127.0.0.1}:${ANILOOP_HTTPS_PORT:-443}:${ANILOOP_TLS_TARGET_PORT:-443}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  accounts:
  cache:
  certificates:
  proxy_config:
